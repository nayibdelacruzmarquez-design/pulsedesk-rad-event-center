[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsedesk"
version = "0.1.0"
description = "PulseDesk RAD - Centro de Control de Eventos"
dependencies = [
    "customtkinter",
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"